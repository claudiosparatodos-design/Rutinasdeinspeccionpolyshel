<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5cad">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Captura digital de rutinas de inspección de máquinas.">
  <title>Rutinas de Inspección</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icono-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inspección">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/hoja.css">
  <script>
    (function () {
      try { var t = localStorage.getItem('ps_tema'); if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="arranque" aria-label="Cargando"><div class="spinner"></div></div>

  <!-- ============ Pantalla de acceso ============ -->
  <div id="pantalla-acceso" hidden>
    <div class="acceso-caja">
      <div class="acceso-marca">
        <div class="acceso-logo" id="acceso-logo"></div>
        <div class="empresa" id="acceso-empresa"></div>
        <h1 id="acceso-titulo">Rutinas de Inspección</h1>
      </div>
      <form class="tarjeta acceso-form" id="form-acceso">
        <input type="text" name="username" autocomplete="username" value="planta" hidden aria-hidden="true">
        <div class="campo">
          <label for="acceso-pass">Contraseña de acceso</label>
          <div class="pass-envoltura">
            <input class="input" id="acceso-pass" type="password" inputmode="text" autocomplete="current-password" required autofocus placeholder="••••••••">
            <button type="button" class="btn-icono" id="acceso-ver" aria-label="Mostrar contraseña"></button>
          </div>
        </div>
        <div class="acceso-error" id="acceso-error" role="alert"></div>
        <button class="btn btn-primario btn-grande btn-bloque" type="submit" id="acceso-btn">Entrar</button>
      </form>
      <div class="acceso-pie" id="acceso-pie"></div>
    </div>
  </div>

  <!-- ============ Aplicación ============ -->
  <div id="app" hidden>
    <header class="cabecera">
      <a class="marca" href="#/inicio">
        <span class="marca-logo" id="marca-logo"></span>
        <span class="marca-txt"><b id="marca-empresa"></b><span id="marca-app"></span></span>
      </a>
      <span class="espacio"></span>
      <span class="estado-sync" id="estado-sync" title=""></span>
      <button class="btn-icono" id="btn-tema" aria-label="Cambiar tema"></button>
      <button class="inspector-btn" id="btn-inspector" title="Cambiar inspector"></button>
    </header>
    <nav class="navegacion" id="navegacion" aria-label="Secciones">
      <a class="nav-item" href="#/inicio" data-ruta="inicio"></a>
      <a class="nav-item" href="#/capturar" data-ruta="capturar"></a>
      <a class="nav-item" href="#/registros" data-ruta="registros"></a>
      <a class="nav-item" href="#/exportar" data-ruta="exportar"></a>
      <a class="nav-item" href="#/graficas" data-ruta="graficas"></a>
      <div class="nav-sep"></div>
      <a class="nav-item" href="#/config" data-ruta="config"></a>
      <a class="nav-item nav-solo-ancho" href="#" id="nav-salir"></a>
      <div class="nav-pie" id="nav-pie"></div>
    </nav>
    <main class="contenido" id="vista" tabindex="-1"></main>
  </div>

  <div id="raiz-impresion"></div>

  <script src="js/config.js"></script>
  <script src="js/formatos.js"></script>
  <script src="vendor/firebase.js"></script>
  <script src="js/util.js"></script>
  <script src="js/modelo.js"></script>
  <script src="js/db.js"></script>
  <script src="js/render.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/vistas/comunes.js"></script>
  <script src="js/vistas/inicio.js"></script>
  <script src="js/vistas/captura.js"></script>
  <script src="js/vistas/registros.js"></script>
  <script src="js/vistas/visor.js"></script>
  <script src="js/vistas/exportar.js"></script>
  <script src="js/vistas/graficas.js"></script>
  <script src="js/vistas/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
